name: Gitleaks Secret Scanning

# Detect hardcoded secrets, API keys, and credentials
on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    # Run every day at 3 AM EST (8:00 UTC)
    - cron: '0 8 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional enterprise
        with:
          args: >
            detect
            --redact
            --no-banner
            --report-format sarif
            --report-path gitleaks.sarif
            --verbose

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Gitleaks detected potential secrets in this PR.**\n\nPlease review the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) for details.\n\n**Action Required:** Remove any exposed credentials and rotate them immediately.'
            })

      - name: Summary
        if: always()
        run: |
          echo "### 🔍 Gitleaks Secret Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "failure" ]; then
            echo "⚠️ **Secrets detected!** Review the Security tab immediately." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No secrets detected in this scan." >> $GITHUB_STEP_SUMMARY
          fi
